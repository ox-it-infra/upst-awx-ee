name: Release

on:
  release:
    types:
      - created

jobs:
  release:
    runs-on: ubuntu-22.04
    name: Release
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Build image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          tox -e docker -- --tag=${{ vars.IMAGE_REGISTRY }}/${{ vars.CONTAINER_NAME }}:${{ github.event.release.tag_name }}

      - name: Apply latest tag
        run: |
         docker tag ${{ vars.IMAGE_REGISTRY }}/${{ vars.CONTAINER_NAME }}:${{ github.event.release.tag_name }} ${{ vars.IMAGE_REGISTRY }}/${{ vars.CONTAINER_NAME }}:latest

      - name: Push images
        run: |
         echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
         docker push ${{ vars.IMAGE_REGISTRY }}/${{ vars.CONTAINER_NAME }}:${{ github.event.release.tag_name }}
         docker push ${{ vars.IMAGE_REGISTRY }}/${{ vars.CONTAINER_NAME }}:latest

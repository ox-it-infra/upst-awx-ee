name: Build and Push latest image

on:
  push:
    # build and push anytime commits are merged to devel
    branches:
      - devel
#  schedule:
#    # build every 12 hours
#    - cron: '0 */12 * * *'

jobs:
  build_and_push_latest:
    runs-on: ubuntu-22.04
    name: Build and push latest tag from devel and on new commits
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        run: |
          docker buildx create --name ${{ vars.CONTAINER_NAME }}-buildx
          docker buildx use ${{ vars.CONTAINER_NAME }}-buildx
          ansible-builder create -v3 --output-file=Dockerfile
          docker buildx build \
            --push \
            --platform=linux/amd64 \
            --tag=${{ vars.IMAGE_REGISTRY }}/${{ vars.CONTAINER_NAME }}:latest \
            context

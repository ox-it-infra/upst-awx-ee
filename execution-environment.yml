---
version: 3
images:
  base_image:
    name: quay.io/centos/centos:stream9
dependencies:
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
  ansible_core:
    # Require minimum of 2.15 to get ansible-inventory --limit option
    package_pip: ansible-core>=2.15.0rc2,<2.16
  ansible_runner:
    package_pip: ansible-runner
  galaxy: |
    ---
    collections:
      - name: awx.awx
      - name: azure.azcollection
        version: ">=2.1.0"
      - name: amazon.aws
      - name: theforeman.foreman
      - name: google.cloud
      - name: openstack.cloud
      - name: community.vmware
      - name: ovirt.ovirt
      - name: kubernetes.core
        # https://github.com/ansible-collections/kubernetes.core/tree/stable-5?tab=readme-ov-file#ansible-version-compatibility
        version: "<6.0.0"
      - name: ansible.posix
      - name: ansible.windows
      - name: redhatinsights.insights
      - name: kubevirt.core
        # this gives us community.general.dig, among others:
      - name: community.general
        # https://github.com/ansible-collections/community.general/blob/stable-11/CHANGELOG.md#removed-features-previously-deprecated need this for ansible-core < 2.16 compatability
        version: "<11.0.0"
        # this gives us netbox integration:
      - name: netbox.netbox
        # this seems to be the latest version that works with ansible 2.15 (via trial and error)
        version: "<3.21.0"
      - name: ansible.utils
        # per https://github.com/ansible-collections/ansible.utils/releases/tag/v6.0.0 need this for ansible-core compatability
        version: "<6.0.0"
        # for backwards compatability (cf https://github.com/ansible/ansible/issues/77223):
      - name: ansible.netcommon
        # per https://github.com/ansible-collections/ansible.netcommon/releases need this for ansible-core < 2.16 compatability
        version: "<8.0.0"
      - name: community.postgresql
      - name: community.mysql
  system: |
    git-core [platform:rpm]
    python3.11-devel [platform:rpm compile]
    libcurl-devel [platform:rpm compile]
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    subversion [platform:rpm]
    subversion [platform:dpkg]
    git-lfs [platform:rpm]
    sshpass [platform:rpm]
    rsync [platform:rpm]
    epel-release [platform:rpm]
    unzip [platform:rpm]
    podman-remote [platform:rpm]
    cmake [platform:rpm compile]
    gcc [platform:rpm compile]
    gcc-c++ [platform:rpm compile]
    make [platform:rpm compile]
    openssl-devel [platform:rpm compile]
  python: |
    git+https://github.com/ansible/ansible-sign
    ncclient
    paramiko
    pykerberos
    pyOpenSSL
    pypsrp[kerberos,credssp]
    pywinrm[kerberos,credssp]
    toml
    pexpect>=4.5
    python-daemon
    pyyaml
    six
    receptorctl
    dnspython
    netaddr
    psycopg2-binary
additional_build_steps:
  append_base:
    - RUN $PYCMD -m pip install -U pip
  append_final:
    - COPY --from=quay.io/ansible/receptor:devel /usr/bin/receptor /usr/bin/receptor
    - RUN mkdir -p /var/run/receptor
    - RUN git lfs install --system
    # SymLink `python` -> `python3.11`
    - RUN alternatives --install /usr/bin/python python /usr/bin/python3.11 311
